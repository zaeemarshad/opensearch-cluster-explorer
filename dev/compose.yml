# Local functional lab. Security is disabled; published ports bind to loopback.
name: cluster-explorer-390-lab
services:
  opensearch-a:
    image: opensearchproject/opensearch:3.9.0
    environment:
      - cluster.name=cluster-explorer-lab
      - node.name=data-a
      - discovery.seed_hosts=opensearch-a,opensearch-b
      - cluster.initial_cluster_manager_nodes=data-a,data-b
      - node.attr.zone=zone-a
      - node.store.allow_mmap=false
      - cluster.routing.allocation.disk.watermark.low=1gb
      - cluster.routing.allocation.disk.watermark.high=512mb
      - cluster.routing.allocation.disk.watermark.flood_stage=256mb
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports: ["127.0.0.1:19200:9200"]
    volumes: ["data-a:/usr/share/opensearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_nodes=2&timeout=2s' | grep -q '\"timed_out\":false'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  opensearch-b:
    image: opensearchproject/opensearch:3.9.0
    environment:
      - cluster.name=cluster-explorer-lab
      - node.name=data-b
      - discovery.seed_hosts=opensearch-a,opensearch-b
      - cluster.initial_cluster_manager_nodes=data-a,data-b
      - node.attr.zone=zone-b
      - node.store.allow_mmap=false
      - cluster.routing.allocation.disk.watermark.low=1gb
      - cluster.routing.allocation.disk.watermark.high=512mb
      - cluster.routing.allocation.disk.watermark.flood_stage=256mb
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes: ["data-b:/usr/share/opensearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_nodes=2&timeout=2s' | grep -q '\"timed_out\":false'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  dashboards:
    profiles: ["packaged"]
    image: cluster-explorer-dashboards:3.9.0
    build: { context: .., dockerfile: dev/Dockerfile }
    depends_on:
      opensearch-a: { condition: service_healthy }
      opensearch-b: { condition: service_healthy }
    ports: ["127.0.0.1:15602:5601"]
    volumes:
      [
        "./opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro",
      ]
volumes:
  data-a:
  data-b:
